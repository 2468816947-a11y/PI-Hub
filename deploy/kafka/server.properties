# =====================================================================
# Kafka KRaft 模式 server.properties 核心配置(参考模板)
# 注意: bitnami/kafka 容器会由 KAFKA_CFG_* 环境变量自动生成该文件,
#       本文件供宿主机自建 Kafka 或对照排查时使用。
# =====================================================================

# ---- KRaft: 单节点同时承担 broker + controller, 免 Zookeeper ----
process.roles=broker,controller
node.id=1
controller.quorum.voters=1@kafka:9093
controller.listener.names=CONTROLLER

# ---- 监听器: 容器内 / 宿主机 / 控制器 ----
listeners=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
advertised.listeners=PLAINTEXT://kafka:9092,EXTERNAL://localhost:9092
listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
inter.broker.listener.name=PLAINTEXT

# ---- 存储与 Topic 策略(与架构文档 §5 一致) ----
log.dirs=/bitnami/kafka/data
num.partitions=3
log.retention.hours=24
auto.create.topics.enable=true

# ---- 单节点必须: 内部 Topic 副本因子 1(否则报 NoReplicaOnlineException) ----
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
group.initial.rebalance.delay.ms=0
