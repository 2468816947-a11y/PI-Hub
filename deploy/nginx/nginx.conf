# =====================================================================
# 电力场站设备巡检数据集成平台 —— Nginx 网关配置
# 挂载位置: /etc/nginx/nginx.conf
# 职责: 前端静态托管 / /api 反向代理双后端轮询 / /api/search 限流 / 图片上传 20m
# =====================================================================
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;   # 隐藏 nginx 版本信息(安全设计)

    # up= 打印命中的后端实例, 用于验证轮询负载均衡
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    'up=$upstream_addr rt=$request_time';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # 图片/文件上传上限 20m(与后端 multipart 配置保持一致)
    client_max_body_size 20m;

    # ---- 接口限流: /api/search 每 IP 10r/s, 突发 20 个请求, 超出返回 429 ----
    limit_req_zone  $binary_remote_addr  zone=search_limit:10m  rate=10r/s;
    limit_req_status 429;

    # ---- Docker 内嵌 DNS: 后端容器重建(IP 变化)后自动重新解析, 避免 502 ----
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ---- 后端双实例负载均衡(默认轮询; 3 次失败踢出 30s) ----
    upstream patrol_backend {
        server backend-app-1:8080 max_fails=3 fail_timeout=30s;
        server backend-app-2:8081 max_fails=3 fail_timeout=30s;
    }

    server {
        listen       80;
        server_name  _;

        # 基础安全头
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;

        # Docker healthcheck 探活端点
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok";
        }

        # ---- 前端静态资源(SPA, 挂载目录 /usr/share/nginx/html) ----
        location / {
            root   /usr/share/nginx/html;
            index  index.html;
            try_files $uri $uri/ /index.html;   # Vue/React history 路由回退
        }

        # 静态资源长缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf)$ {
            root /usr/share/nginx/html;
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
        }

        # ---- 检索接口限流 10r/s(前缀匹配, 优先级高于 /api/) ----
        location /api/search {
            limit_req zone=search_limit burst=20 nodelay;

            # 429 时带 Retry-After 告知客户端退避 1s(接口文档 §1.3);
            # 注意: location 内出现 add_header 后, server 级安全头不再继承, 需在此重复声明
            add_header Retry-After "1" always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header X-Content-Type-Options nosniff always;

            set $backend_pool http://patrol_backend;
            proxy_pass $backend_pool;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }

        # ---- 其余 /api 接口反向代理(轮询负载均衡) ----
        location /api/ {
            set $backend_pool http://patrol_backend;
            proxy_pass $backend_pool;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }
    }
}
